name: Build RSS Feeds

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Debug Python/TLS
        run: uv run python -c "
import ssl, sys, urllib.request
print(f'Python: {sys.version}')
print(f'SSL: {ssl.OPENSSL_VERSION}')
for url in ['https://gijn.org/jobs/', 'https://gijn.org/?feed=rss2&cat=23037']:
    try:
        req = urllib.request.Request(url, headers={
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36',
            'Accept': 'text/html,application/xhtml+xml',
        })
        resp = urllib.request.urlopen(req, timeout=15)
        print(f'OK {url}: {resp.status}, {len(resp.read())} bytes')
    except Exception as e:
        print(f'FAIL {url}: {e}')
"

      - name: Run feed builder
        run: uv run python runner.py

      - name: Commit state changes
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "update feed state [skip ci]"
            git push
          else
            echo "No state changes"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: feeds

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
